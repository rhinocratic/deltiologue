services:
  database:
    container_name: deltiologue_database
    build:
      context: ./deltiologue-server
      dockerfile: docker/postgis/Dockerfile
    ports:
      - 5432:5432
    env_file:
      - .env
    networks:
      - deltiologue
    volumes:
      - deltiologue_pgdata:/data/postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d deltiologue -U deltiologue"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  server:
    container_name: deltiologue_server
    build:
      context: ./deltiologue-server
      dockerfile: docker/server/Dockerfile
    ports:
      - 8080:8080
    env_file:
      - .env
    networks:
      - deltiologue
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - deltiologue_app_data:/usr/src/app/data/images
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/healthz | grep OK || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  ui:
    container_name: deltiologue_ui
    build:
      context: ./deltiologue-ui
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    ports:
      - 5173:5173
    volumes:
      - deltiologue_app_data:/app/public/images
    depends_on:
      server:
        condition: service_healthy
    networks:
      - deltiologue


networks:
  deltiologue:
    driver: bridge

volumes:
  deltiologue_pgdata:
  deltiologue_app_data: